<!doctype html>
<html lang="en">
  <head>
    <title>jaDisco.pl</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" type="text/css" href="popup.css" />
    <link rel="stylesheet" type="text/css" href="animation.css" />
    <link rel="stylesheet" type="text/css" href="glow.css" />
    <link rel="stylesheet" type="text/css" href="background.css" />
  </head>
  <body>
    <header class="header">
      <span
        id="openSidePanel"
        class="settings cursor-pointer"
        title="Open side chat"
        >💬</span
      >
      <img id="logo" src="images/logo.png" alt="jaDisco.pl" />
      <span id="settingsButton" class="settings cursor-pointer">⚙️</span>
    </header>
    <div class="background"></div>
    <div class="info-wrapper">
      <div class="status-wrapper section">
        <div class="info-line">
          <span>Status:</span>
          <span id="status"></span>
        </div>
        <span id="statusTime" class="date"></span>
      </div>
      <div class="topic section">
        <div class="topic-title">
          <span>Temat:</span>
          <span id="topicTime" class="date">Brak danych</span>
        </div>
        <p id="topic">Brak danych</p>
      </div>
    </div>
    <div id="settings" class="settings-wrapper" hidden>
      <div class="wrapper">
        <div class="input-group">
          <label for="volume">Głośność</label>
          <input
            type="range"
            id="volume"
            min="0"
            max="1"
            value="0.5"
            step="0.1"
          />
          <button id="testSound" class="sound-button" type="button">
            Test
          </button>
        </div>
        <div class="input-group">
          <input class="cursor-pointer" type="checkbox" id="muted" />
          <label class="cursor-pointer" for="muted">Wycisz</label>
        </div>
        <div class="input-group">
          <input class="cursor-pointer" type="checkbox" id="notificationMode" />
          <label class="cursor-pointer" for="notificationMode"
            >Auto-chowanie powiadomień</label
          >
        </div>
        <div class="input-group">
          <input
            class="cursor-pointer"
            type="checkbox"
            id="notifyOnStreamStart"
          />
          <label class="cursor-pointer" for="notifyOnStreamStart"
            >Powiadom o początku strumienia</label
          >
        </div>
        <div class="input-group">
          <input
            class="cursor-pointer"
            type="checkbox"
            id="notifyOnTopicChange"
          />
          <label class="cursor-pointer" for="notifyOnTopicChange"
            >Powiadom o zmianie tematu</label
          >
        </div>
        <div class="input-group">
          <input
            class="cursor-pointer"
            type="checkbox"
            id="openChatOnNotificationClick"
          />
          <label class="cursor-pointer" for="openChatOnNotificationClick"
            >Otwórz czat z powiadomienia</label
          >
        </div>
        <div class="input-group">
          <input
            class="cursor-pointer"
            type="checkbox"
            id="openPageOnNotificationClick"
          />
          <label class="cursor-pointer" for="openPageOnNotificationClick"
            >Otwórz stronę z powiadomienia</label
          >
        </div>
      </div>
      <div class="action-buttons">
        <button id="manualRefresh" type="button">🔄 Odśwież status</button>
        <button id="report" type="button">🐛 Zgłoś buga albo funkcję 🌟</button>
        <button id="testNotification" type="button">
          ✨ Test powiadomienia
        </button>
      </div>
      <div class="settings-meta">
        <span>Wersja</span>
        <span id="extensionVersion"></span>
      </div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
